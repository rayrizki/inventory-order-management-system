; PRD-01: batas ukuran gambar produk yang divalidasi ProductService adalah
; 2MB (MAX_IMAGE_SIZE_BYTES) - tapi php.ini bawaan image resminya sendiri
; sudah membatasi upload_max_filesize/post_max_size di bawah itu untuk
; sebagian konfigurasi, sehingga file yang sedikit di atas 2MB ditolak PHP
; sendiri (UPLOAD_ERR_INI_SIZE, pesan generik "kode error: 1") SEBELUM
; sempat mencapai validasi aplikasi yang lebih informatif. Dinaikkan ke 5MB
; di sini supaya validasi ukuran yang sebenarnya berlaku (dan pesannya yang
; ditampilkan ke user) adalah punya ProductService, bukan batas ini - batas
; ini cuma jadi pagar pengaman kasar di lapisan PHP (defense-in-depth),
; bukan mekanisme validasi utama.
upload_max_filesize = 5M
post_max_size = 6M
