; ERR-01: exception/stack trace tidak boleh tampil ke user (juga disebut
; eksplisit di kriteria Critical Failure brief). Ditambahkan sebagai lapis
; kedua di luar try/catch di public/index.php - beberapa fatal error (mis.
; saat bootstrap, sebelum baris try dijalankan) tidak tertangkap try/catch
; sama sekali, jadi harus dimatikan juga di level PHP.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr
