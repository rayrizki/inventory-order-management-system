; PCOV dipasang untuk menghasilkan laporan coverage PHPUnit yang dibaca
; SonarQube, tapi dimatikan secara default supaya tidak membebani request
; aplikasi sehari-hari. Diaktifkan per-perintah saat memang menghitung
; coverage:
;
;   docker compose exec app php -d pcov.enabled=1 vendor/bin/phpunit \
;       --coverage-clover coverage/clover.xml
;
pcov.enabled = 0

; Batasi instrumentasi ke kode aplikasi saja - tanpa ini PCOV ikut menelusuri
; vendor/ dan membuat laporannya besar serta lambat tanpa guna.
pcov.directory = /var/www/html/app
