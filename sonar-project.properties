# Konfigurasi SonarQube untuk Inventory & Order Management System.
# Dijalankan lewat sonar-scanner CLI terhadap server SonarQube Community
# Edition yang berjalan lokal di Docker - lihat docs/quality/sonarqube.md
# untuk perintah lengkapnya.

sonar.projectKey=inventory-order-management-system
sonar.projectName=Inventory & Order Management System
sonar.projectVersion=1.0.0

# Lapisan aplikasi yang dianalisis. `views/` sengaja DIMASUKKAN meski
# PHPStan tidak menganalisisnya (template PHP mengandalkan variabel dari
# scope pemanggil, lihat docs/quality/static-analysis.md) - SonarQube
# menutup titik buta itu.
sonar.sources=app,config,public,scripts,views

# Test dipisah supaya metrik (duplication, complexity) dihitung terhadap
# kode produksi, bukan ikut terdilusi oleh kode test.
sonar.tests=tests

sonar.sourceEncoding=UTF-8

# vendor/ adalah dependency pihak ketiga; coverage/ dan cache adalah
# artefak build yang memang tidak masuk repo.
sonar.exclusions=vendor/**,coverage/**,.phpunit.cache/**,public/uploads/**
